name: LlamaGLM Windows development

on:
  push:
    branches: [codex/glm53-3pc-rpc]
    paths:
      - '.github/workflows/glm-windows.yml'
      - 'scripts/glm-*'
      - 'tools/glm-stage/**'
      - 'tools/CMakeLists.txt'
      - 'tests/**'
      - 'src/**'
      - 'include/**'
      - 'ggml/**'
      - 'common/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glm-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 ${{ matrix.backend }}
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda]
    env:
      CUDA_ARCHS: '89-real;120-real'
      CCCL_SHA: e46b01ff821f3badeea858f0124ce00a7dd7d05a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record toolchain and runner capacity
        shell: pwsh
        run: |
          cmake --version
          python --version
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, TotalVisibleMemorySize, FreePhysicalMemory
          Get-PSDrive C | Select-Object Used, Free
      - name: Install verified CUDA 12.8.1 components
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: ./scripts/glm-install-cuda.ps1 -InstallDirectory "$env:RUNNER_TEMP/cuda-12.8.1"
      - name: Fetch pinned CCCL
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NVIDIA/cccl.git "$env:RUNNER_TEMP/cccl"
          if ($LASTEXITCODE -ne 0) { throw 'CCCL clone failed' }
          git -C "$env:RUNNER_TEMP/cccl" checkout --detach $env:CCCL_SHA
          if ($LASTEXITCODE -ne 0) { throw 'CCCL checkout failed' }
      - name: Configure and compile native application targets
        shell: cmd
        env:
          GLM_BACKEND: ${{ matrix.backend }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          set "GLM_CUDA_FLAGS=-DGGML_CUDA=OFF"
          if "%GLM_BACKEND%"=="cuda" set "GLM_CUDA_FLAGS=-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=%CUDA_ARCHS% -DGGML_CUDA_CCCL_VERSION=%CCCL_SHA% -DFETCHCONTENT_SOURCE_DIR_CCCL=%RUNNER_TEMP%/cccl"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF %GLM_CUDA_FLAGS%
          if errorlevel 1 exit /b 1
          cmake --build build --parallel 2 --target llama-glm-plan test-glm-stage test-gguf test-llama-archs llama-server llama-cli
          if errorlevel 1 exit /b 1
      - name: Run CPU ownership and GGUF tests
        shell: pwsh
        run: |
          ctest --test-dir build -R '^(test-glm-stage|test-gguf)$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'CPU tests failed' }
          ./build/bin/test-llama-archs.exe --arch glm5-next --backend CPU --seed 53 -v 5 *> glm-cpu-fixture.log
          if ($LASTEXITCODE -ne 0) { throw 'GLM CPU fixture failed' }
          if (-not (Select-String -Path glm-cpu-fixture.log -Pattern 'Summary: all [1-9][0-9]* test\(s\) passed' -Quiet)) {
            throw 'GLM fixture did not report completed tests'
          }
          Get-Content glm-cpu-fixture.log -Tail 8
      - name: Audit pinned real quant metadata without weights
        shell: pwsh
        run: |
          python scripts/glm-fetch-metadata.py "$env:RUNNER_TEMP/glm-headers"
          if ($LASTEXITCODE -ne 0) { throw 'Metadata fetch failed' }
          $Headers = @(Get-ChildItem "$env:RUNNER_TEMP/glm-headers/*.header" | Sort-Object Name | ForEach-Object { $_.FullName })
          ./build/bin/llama-glm-plan.exe --output glm-memory-manifest.json @Headers
          if ($LASTEXITCODE -ne 0) { throw 'Quant inventory failed' }
      - name: Record exact build identity and executable behavior
        shell: pwsh
        run: |
          ./build/bin/llama-glm-plan.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Planner launch failed' }
          ./build/bin/llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Server launch failed' }
          $Status = [ordered]@{ source_sha = $env:GITHUB_SHA; backend = '${{ matrix.backend }}'; run_id = $env:GITHUB_RUN_ID; cuda_architectures = $env:CUDA_ARCHS; gpu_execution = 'NOT_RUN'; three_pc_execution = 'NOT_RUN'; product_source = 'PARTIAL' }
          $Status | ConvertTo-Json | Set-Content build-identity.json
      - name: Retain development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glm-windows-${{ matrix.backend }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            build-identity.json
            glm-memory-manifest.json
            glm-cpu-fixture.log
            build/Testing/Temporary/LastTest.log
            build/CMakeCache.txt
            build/bin/*.exe
            build/bin/*.dll
            LICENSE
